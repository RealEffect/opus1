[package]
name = "opus1-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `__internals`: the test-only module `opus1::internals`, which
# `fuzz_dnn_blob` uses. opus1's default features stay on.
opus1 = { path = "..", features = ["__internals"] }
# The raw C interface of libopus, the reference the differential targets
# compare with. It finds libopus as the main crate's tests do (see
# docs/guide/09-testing.md, "How libopus is linked").
audiopus_sys = "0.2"

# `dnn`: opus1's neural network features, for `fuzz_dnn_blob` only. That
# target requires it, and `fuzz.sh` builds it in a separate cargo call, so
# the other targets keep opus1's default features (the neural network
# features change what the decoder does on lost packets).
#
# `dred`: opus1's `osce-bwe` and `dred`, for `fuzz_dred` and
# `fuzz_decoder_dnn` only. `fuzz.sh` builds them in a cargo call of their
# own, for the same reason.
[features]
dnn = ["opus1/osce-bwe"]
dred = ["opus1/osce-bwe", "opus1/dred"]

[dev-dependencies]

