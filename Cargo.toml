[package]
edition = "2024"
# The aarch64 DotProd intrinsics of the neural network code are stable from
# Rust 1.98 on.
rust-version = "1.98"
authors = ["jinti <shenjindi@fourz.cn>", "gaojiangjie <gaojiangjie@live.com>"]
name = "opus1"
version = "0.2.0"
description = "Pure-Rust implementation of the Opus audio codec (RFC 6716), following libopus 1.x"
keywords = ["opus", "audio", "codec", "no_std"]
categories = ["multimedia::audio", "multimedia::encoding", "no-std", "embedded"]
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/restsend/opus-rs"
# Left out of the published crate: repository-only files. The tests compare
# with a linked libopus and read corpora that are not packaged, and the scripts
# build libopus and run the phone and x86 checks. `docs/` and `README.md` stay:
# src/lib.rs includes them for the documentation tests. `dnn-weights/` stays:
# the neural network features embed it with `include_bytes!`.
exclude = [
    "opus-1.6.1/",
    "fuzz/",
    "fixtures/",
    "corpus/",
    "/tests/",
    "/scripts/",
    "/bench_quick.sh",
]

[features]
default = ["std", "heap", "analysis"]
# `std` enables OS-backed runtime x86 SIMD detection (CPUID); without it, x86
# SIMD falls back to compile-time `target_feature` detection.
std = []
# With `heap` (default), the large codec state (`OpusEncoder`/`OpusDecoder`
# working buffers) lives on the heap behind `Box`, so the public structs are
# small (a few KB) and constructing them uses almost no stack. This requires
# `std`.
#
# Without `heap` (i.e. `default-features = false`), the crate is `#![no_std]`
# with **no `alloc`** (fully heap-free — no global allocator required): every
# working buffer is an inline fixed-size array, so `OpusEncoder`/`OpusDecoder`
# are large (on aarch64 about 154 KB with `analysis` and 60 KB) and must be placed in a `static` or on a large
# stack by the caller.
heap = ["std"]
# Required for `#![no_std]` builds: provides `sin`/`cos`/`sqrt`/`exp2`/... via a
# pure-Rust port of musl libm (`core` does not provide transcendentals). Not
# needed when `std` is enabled. Enable with:
#   opus1 = { version = "...", default-features = false, features = ["libm"] }
libm = ["dep:libm"]
# The speech and music analysis of the encoder (libopus `src/analysis.c` and
# `src/mlp.c`), which libopus runs from complexity 7 on. It adds about 28 KB
# of code, 24 KB of tables (mostly the network weights) and 26 KB of state
# per encoder. Without it, the encoder behaves as libopus below complexity
# 7: no speech or music probability, no detected bandwidth.
analysis = []

# Neural network features of libopus 1.5 and later. All are off by default,
# as in libopus. They work with and without `std` (a `no_std` build needs
# `libm`, as above).
#
# `dnn`: the shared inference layer (layer kernels, weight blob parser).
# Not meant to be selected alone: each feature below that needs it turns
# it on.
dnn = []
# `deep-plc`: deep packet loss concealment (PitchDNN, the PLC model and
# FARGAN), like libopus's `--enable-deep-plc`. It conceals lost SILK
# wideband and CELT-only frames at decoder complexity 5 and above. As in
# libopus, compiling it also changes SILK at every complexity: the fade-in
# of the first 16 kHz frame after a loss is skipped.
deep-plc = ["dnn"]
# `osce`: the LACE and NoLACE speech enhancers of SILK, which run at
# decoder complexity 6 and at 7 and above on 20 ms SILK frames at 16 kHz.
# It turns on `deep-plc`, as libopus's `--enable-osce` does. As in
# libopus, compiling it also changes SILK at every complexity: -32768
# becomes -32767 in those frames.
osce = ["deep-plc"]
# `osce-bwe`: the bandwidth extension of SILK wideband to 48 kHz
# (BBWENet), at decoder complexity 4 and above when it is switched on
# with `OpusDecoder::set_osce_bwe`. It turns on `osce`.
osce-bwe = ["osce"]
# `dred`: deep redundancy (DRED), like libopus's `--enable-dred`. The
# encoder adds a compressed history of the speech to each packet, in a
# packet extension, and the decoder rebuilds lost frames from it. It turns
# on `deep-plc`, as libopus's `--enable-dred` does. For now it adds the two
# DRED models (the RDOVAE encoder and decoder) and their weights; the
# encoder and decoder parts are being ported.
dred = ["deep-plc"]
#
# `test-libopus-dnn`: TEST-ONLY. It adds nothing to the library. It only
# compiles the test files that begin with
# `#![cfg(feature = "test-libopus-dnn")]`. Those tests call the neural
# network functions of a libopus built with them (for example
# `scripts/android/build-libopus.sh --dnn`), linked through
# `LIBOPUS_LIB_DIR`, `LIBOPUS_NO_PKG=1` and `LIBOPUS_STATIC=1`, in their own
# `CARGO_TARGET_DIR`. Against a libopus without that code (such as the
# Homebrew build) they fail to link, so `cargo test --all-features` fails
# there. Applications never enable it.
test-libopus-dnn = []

[dependencies]
libm = { version = "0.2", optional = true, default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1"
opus = { version = "0.3", default-features = false }
# Raw C API of the same libopus (opus_encoder_ctl, opus_decode_float with the
# FEC flag, the repacketizer, the multistream functions). The `opus` crate
# above already links it; examples/perf_harness.rs and the k24_* tests need
# controls that crate does not expose, such as forcing the coding mode.
audiopus_sys = "0.2"
[[bench]]
name = "opus_bench"
harness = false
[[bench]]
name = "dnn_bench"
harness = false
required-features = ["dnn"]
[[bench]]
name = "deep_plc_bench"
harness = false
required-features = ["deep-plc"]
