[package]
edition = "2024"
authors = ["jinti<shenjindi@fourz.cn>"]
name = "opus1"
version = "0.2.0"
description = "Pure-Rust implementation of the Opus audio codec (RFC 6716), following libopus 1.x"
keywords = ["opus", "audio", "codec", "no_std"]
categories = ["multimedia::audio", "multimedia::encoding", "no-std", "embedded"]
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/restsend/opus-rs"
exclude = [
    "opus-1.6.1/",
    "fuzz/",
    "fixtures/",
    "corpus/",
]

[features]
default = ["std", "heap"]
# `std` enables OS-backed runtime x86 SIMD detection (CPUID); without it, x86
# SIMD falls back to compile-time `target_feature` detection.
std = []
# With `heap` (default), the large codec state (`OpusEncoder`/`OpusDecoder`
# working buffers) lives on the heap behind `Box`, so the public structs are
# small (a few KB) and constructing them uses almost no stack. This requires
# `std`.
#
# Without `heap` (i.e. `default-features = false`), the crate is `#![no_std]`
# with **no `alloc`** (fully heap-free — no global allocator required): every
# working buffer is an inline fixed-size array, so `OpusEncoder`/`OpusDecoder`
# are large (~135 KB / ~67 KB) and must be placed in a `static` or on a large
# stack by the caller.
heap = ["std"]
# Required for `#![no_std]` builds: provides `sin`/`cos`/`sqrt`/`exp2`/... via a
# pure-Rust port of musl libm (`core` does not provide transcendentals). Not
# needed when `std` is enabled. Enable with:
#   opus1 = { version = "...", default-features = false, features = ["libm"] }
libm = ["dep:libm"]

# Neural network features of libopus 1.5 and later. All are off by default,
# as in libopus. They work with and without `std` (a `no_std` build needs
# `libm`, as above).
#
# `dnn`: the shared inference layer (layer kernels, weight blob parser).
# Not meant to be selected alone: each feature below that needs it turns
# it on.
dnn = []
# `deep-plc`: deep packet loss concealment (PitchDNN, the PLC model and
# FARGAN), like libopus's `--enable-deep-plc`. It runs at decoder
# complexity 5 and above.
deep-plc = ["dnn"]
# `osce`: the LACE and NoLACE speech enhancers of SILK, which run at
# decoder complexity 6 and at 7 and above. It turns on `deep-plc`, as
# libopus's `--enable-osce` does.
osce = ["deep-plc"]
# `osce-bwe`: the bandwidth extension of SILK wideband to 48 kHz (BBWENet).
# It turns on `osce`.
osce-bwe = ["osce"]
# A later `dred` feature (deep redundancy) is planned; it is not part of
# this release.
#
# `test-libopus-dnn`: TEST-ONLY. It adds nothing to the library. It only
# compiles the test files that begin with
# `#![cfg(feature = "test-libopus-dnn")]`. Those tests call the neural
# network functions of a libopus built with them (for example
# `scripts/android/build-libopus.sh --dnn`), linked through
# `LIBOPUS_LIB_DIR`, `LIBOPUS_NO_PKG=1` and `LIBOPUS_STATIC=1`, in their own
# `CARGO_TARGET_DIR`. Against a libopus without that code (such as the
# Homebrew build) they fail to link, so `cargo test --all-features` fails
# there. Applications never enable it.
test-libopus-dnn = []

[dependencies]
libm = { version = "0.2", optional = true, default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1"
opus = { version = "0.3", default-features = false }
# Raw C API of the same libopus (opus_encoder_ctl, opus_decode_float with the
# FEC flag, the repacketizer, the multistream functions). The `opus` crate
# above already links it; examples/perf_harness.rs and the k24_* tests need
# controls that crate does not expose, such as forcing the coding mode.
audiopus_sys = "0.2"
[[bench]]
name = "opus_bench"
harness = false
[[bench]]
name = "dnn_bench"
harness = false
required-features = ["dnn"]
